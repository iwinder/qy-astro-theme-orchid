# 发版流程（M4-4）：推送 v* tag 触发 → 校验 tag 与包版本一致 →
# test + 完整构建验证 → npm stage publish 暂存（trusted publishing OIDC）
# → 维护者在 npmjs.com「Staged Packages」或 npm stage approve 批准（2FA）上线。
# 发布走 trusted publishing（OIDC）：无需 NPM_TOKEN secret，npm 在
# GitHub Actions 内自动以仓库工作负载身份换取短期发布凭证。
# 注意：2026-09-03 后新建的 trusted publisher 默认仅允许 stage publish，
# 直接 npm publish 会 403 "OIDC permission denied for this action"
# （v0.2.1 发版排障实测确认），故采用官方推荐的 stage-only 姿态。
# 前置配置（一次性）：npmjs.com 包页面 Settings → Trusted publishing，
# 填 iwinder/qy-astro-theme-orchid + workflow 文件名 release.yml。
# 注意：tag push 不会触发 ci.yml，本工作流自带发布前验证。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 GitHub Release 并上传附件（OIDC 发布用 id-token: write）
  id-token: write # trusted publishing OIDC + npm provenance

jobs:
  publish:
    # 固定 24.04：ubuntu-latest 已于 2026-10-19 迁移 Ubuntu 26，实测导致
    # npm publish（provenance/OIDC 上传阶段）静默 exit 1（v0.2.1 连续失败）
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm（版本读根 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Node 22 自带 npm 10.x：trusted publishing 的 OIDC 发布需 npm ≥ 11.5，
      # stage publish 需 npm ≥ 11.15；钉住具体版本保证发版环境可复现
      - name: Upgrade npm
        run: npm install -g npm@11.21.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/theme/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 packages/theme 版本 $PKG_VERSION 不一致"
            exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/test.log

      # 排障临时步骤：CI 挂 Test 而本地全绿，经注解带出关键报错，定位后移除
      - name: 失败注解：测试日志关键段
        if: failure()
        run: |
          test -f /tmp/test.log || { echo "::error::无 /tmp/test.log"; exit 0; }
          tail -n 60 /tmp/test.log | grep -anE '✖|not ok|Error|ℹ fail|ERR' | head -n 9 | cut -c1-190 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Build site（发布前完整构建验证）
        run: |
          pnpm --filter site lqip
          pnpm --filter site build

      # stage-only 发版：暂存后由维护者批准上线（2FA）。
      # 批准入口：npmjs.com → Staged Packages → Approve，或 CLI
      # `npm stage approve <stage-id>`（stage-id 见本步骤日志输出）。
      # 失败时把 npm 错误输出为 ::error:: 注解（对公开仓库可经 API 匿名读取，
      # 免登录即可排障；成功路径即官方 stage publish 标准流程）。
      - name: Stage publish to npm（trusted publishing OIDC，暂存待批准）
        working-directory: packages/theme
        run: |
          set -o pipefail
          if npm stage publish 2>&1 | tee /tmp/npm-publish.log; then
            echo "已暂存：请到 npmjs.com → Staged Packages 批准（2FA），或 npm stage approve <stage-id>"
          else
            CODE=$?
            grep -aiE 'npm error|[0-9]{3} [A-Z]|forbidden|denied|EPERM|EACCES|OIDC|provenance' /tmp/npm-publish.log | head -n 5 | tr -d '\000-\010\013\014\016-\037\177' | while IFS= read -r line; do
              ESC=${line//%/%25}; ESC=${ESC//$'\r'/%0D}
              echo "::error::${ESC:0:180}"
            done
            echo "::error::stage publish exit=$CODE log_lines=$(wc -l < /tmp/npm-publish.log)"
            exit "$CODE"
          fi

      # tag 的 source code 归档是 GitHub 平台固定行为（git archive 整仓快照，
      # 不可定制成子目录），这里把 npm pack 产出的主题包 tarball 挂到
      # Release 附件，补齐「主题本身」的可下载物。
      - name: Pack theme tarball
        run: |
          mkdir -p /tmp/dist
          npm pack --pack-destination /tmp/dist
        working-directory: packages/theme

      - name: Attach tarball to GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" /tmp/dist/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
