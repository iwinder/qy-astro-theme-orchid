# 发版流程（M4-4）：推送 v* tag 触发 → 校验 tag 与包版本一致 →
# test + 完整构建验证 → npm 发布（public scoped + provenance）。
# 发布走 trusted publishing（OIDC）：无需 NPM_TOKEN secret，npm 在
# GitHub Actions 内自动以仓库工作负载身份换取短期发布凭证。
# 前置配置（一次性）：npmjs.com 包页面 Settings → Trusted publishing，
# 填 iwinder/qy-astro-theme-orchid + workflow 文件名 release.yml。
# 注意：tag push 不会触发 ci.yml，本工作流自带发布前验证。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 GitHub Release 并上传附件（OIDC 发布用 id-token: write）
  id-token: write # trusted publishing OIDC + npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm（版本读根 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Node 22 自带 npm 10.x，trusted publishing 的 OIDC 发布需 npm ≥ 11.5
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/theme/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 packages/theme 版本 $PKG_VERSION 不一致"
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Build site（发布前完整构建验证）
        run: |
          pnpm --filter site lqip
          pnpm --filter site build

      # 失败时把 npm 错误输出为 ::error:: 注解（对公开仓库可经 API 匿名读取，
      # 免登录即可排障；成功路径与原 npm publish --provenance 完全一致）。
      - name: Publish to npm（trusted publishing OIDC，无 token）
        working-directory: packages/theme
        run: |
          set -o pipefail
          if npm publish --provenance 2>&1 | tee /tmp/npm-publish.log; then
            echo "publish ok"
          else
            CODE=$?
            tail -n 25 /tmp/npm-publish.log | tr -d '\000-\010\013\014\016-\037\177' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:180}"
            done
            exit "$CODE"
          fi

      # 排障兜底：publish 失败时把完整日志提交到 publish-debug 分支，
      # contents API 匿名可读（注解可能被 runner 丢弃，分支提交保证可见）。
      - name: Dump publish log to publish-debug branch
        if: failure()
        run: |
          if [ -f /tmp/npm-publish.log ]; then
            git config user.email "ci@windcoder.com"
            git config user.name "release-debug"
            git checkout -B publish-debug
            mkdir -p .publish-debug
            cp /tmp/npm-publish.log .publish-debug/last.log
            git add .publish-debug/last.log
            git commit -m "debug: publish log ($(date -u +%FT%TZ))"
            git push -f origin publish-debug
          fi

      # tag 的 source code 归档是 GitHub 平台固定行为（git archive 整仓快照，
      # 不可定制成子目录），这里把 npm pack 产出的主题包 tarball 挂到
      # Release 附件，补齐「主题本身」的可下载物。
      - name: Pack theme tarball
        run: |
          mkdir -p /tmp/dist
          npm pack --pack-destination /tmp/dist
        working-directory: packages/theme

      - name: Attach tarball to GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" /tmp/dist/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
