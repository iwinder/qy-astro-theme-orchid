# CI：build 矩阵（Node LTS × pnpm），从零检出完整走一遍「install → LQIP → astro build → pagefind」。
# 与本地 pnpm --filter site build 完全同源，本地绿 = CI 绿（仅存 YAML/环境差异）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Biome
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Biome（版本与根 package.json devDep 一致）
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          version: 2.5.15

      - name: Run Biome
        run: biome check .

  build:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    name: Build (Node ${{ matrix.node }})
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm（版本读根 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test（node:test 内置运行器，字体子集化脚本）
        run: pnpm test

      - name: Type check（astro check）
        run: pnpm check

      - name: Generate LQIP data
        run: pnpm --filter site lqip

      - name: Build site（astro build + 字体子集化 + pagefind 索引）
        run: pnpm --filter site build

      - name: Verify pagefind index
        run: test -f site/dist/pagefind/pagefind-entry.json && echo "pagefind index OK"
