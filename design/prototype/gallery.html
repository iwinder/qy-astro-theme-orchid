        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>

<main id="main" class="site-main">
  <div class="shell">
    <header class="archive-head reveal">
      <h1 class="page-title">画廊</h1>
      <p class="page-sub">四个相册 · 用光影记录日常</p>
    </header>
    <div class="chips reveal" role="group" aria-label="相册筛选">
      <button class="chip is-on" type="button" data-filter="">全部</button>
      <button class="chip" type="button" data-filter="旅行">旅行</button>
      <button class="chip" type="button" data-filter="夜景">夜景</button>
      <button class="chip" type="button" data-filter="植物">植物</button>
      <button class="chip" type="button" data-filter="户外">户外</button>
    </div>
    <div class="gallery-grid">
      <article class="album-card card reveal" role="button" tabindex="0" data-cat="旅行" data-album="0" aria-label="打开相册：江南行记">
        <div class="album-cover">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=jiangnan%20water%20town%20canal%2C%20white%20walls%20and%20dark%20tile%20roofs%2C%20stone%20bridge%2C%20soft%20spring%20light%2C%20chinese%20aesthetic%20photography&image_size=square" alt="江南行记" loading="lazy"/>
        </div>
        <div class="album-info">
          <span class="album-name">江南行记</span>
          <span class="album-count">6 张</span>
        </div>
        <div class="album-tags"><span class="chip">旅行</span><span class="chip">街拍</span></div>
      </article>
      <article class="album-card card reveal" role="button" tabindex="0" data-cat="夜景" data-album="1" aria-label="打开相册：城市夜色">
        <div class="album-cover">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=city%20street%20at%20night%2C%20neon%20signs%20reflections%20on%20wet%20asphalt%2C%20cinematic%20moody%20blue%20tones&image_size=square" alt="城市夜色" loading="lazy"/>
        </div>
        <div class="album-info">
          <span class="album-name">城市夜色</span>
          <span class="album-count">8 张</span>
        </div>
        <div class="album-tags"><span class="chip">夜景</span><span class="chip">街头</span></div>
      </article>
      <article class="album-card card reveal" role="button" tabindex="0" data-cat="植物" data-album="2" aria-label="打开相册：草木清欢">
        <div class="album-cover">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=close-up%20green%20leaves%20with%20dew%20drops%2C%20soft%20backlight%2C%20minimal%20nature%20macro%20photography%2C%20calm%20mood&image_size=square" alt="草木清欢" loading="lazy"/>
        </div>
        <div class="album-info">
          <span class="album-name">草木清欢</span>
          <span class="album-count">5 张</span>
        </div>
        <div class="album-tags"><span class="chip">植物</span><span class="chip">微距</span></div>
      </article>
      <article class="album-card card locked reveal" role="button" tabindex="0" data-cat="户外" data-album="3" aria-label="打开相册：山野徒步（加密）">
        <div class="album-cover">
          <span class="lock-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            加密
          </span>
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=mountain%20hiking%20trail%20above%20sea%20of%20clouds%20at%20sunrise%2C%20layered%20peaks%2C%20soft%20warm%20light%2C%20vast%20landscape&image_size=square" alt="山野徒步" loading="lazy"/>
        </div>
        <div class="album-info">
          <span class="album-name">山野徒步</span>
          <span class="album-count">12 张</span>
        </div>
        <div class="album-tags"><span class="chip">户外</span></div>
      </article>
    </div>
    <div class="modal" id="lockModal" aria-hidden="true">
      <div class="modal-box" id="lockBox" role="dialog" aria-modal="true" aria-label="加密相册解锁">
        <h3>加密相册</h3>
        <p class="modal-hint">「山野徒步」已加密，请输入密码查看。密码提示：主题名</p>
        <input id="lockInput" type="password" placeholder="输入密码" autocomplete="off"/>
        <div class="modal-error" id="lockError" role="alert"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="lockCancel" type="button">取消</button>
          <button class="btn" id="lockOk" type="button">解锁</button>
        </div>
      </div>
    </div>

<script src="app.js"></script>
<script>
/* gallery 页专属：chips 筛选 / 灯箱 / 加密相册弹窗 */
(() => {
  'use strict';
  var IMG = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=';
  var P = (q, size) => IMG + q + '&image_size=' + (size || 'square');
  var ALBUMS = [
    [
      { src: P('jiangnan%20water%20town%20canal%2C%20white%20walls%20and%20dark%20tile%20roofs%2C%20stone%20bridge%2C%20soft%20spring%20light%2C%20chinese%20aesthetic%20photography'), cap: '清晨的水巷' },
      { src: P('old%20stone%20bridge%20over%20calm%20river%20in%20morning%20mist%2C%20jiangnan%20water%20town%2C%20muted%20tones', 'landscape_4_3'), cap: '晨雾中的石桥' }
    ],
    [
      { src: P('city%20street%20at%20night%2C%20neon%20signs%20reflections%20on%20wet%20asphalt%2C%20cinematic%20moody%20blue%20tones'), cap: '霓虹落在湿漉漉的街道' }
    ],
    [
      { src: P('close-up%20green%20leaves%20with%20dew%20drops%2C%20soft%20backlight%2C%20minimal%20nature%20macro%20photography%2C%20calm%20mood'), cap: '叶背的露水' },
      { src: P('white%20wall%20with%20tree%20shadow%20in%20afternoon%20light%2C%20minimal%20chinese%20architecture%20detail%2C%20calm%20composition', 'landscape_4_3'), cap: '白墙上的树影' }
    ],
    [
      { src: P('mountain%20hiking%20trail%20above%20sea%20of%20clouds%20at%20sunrise%2C%20layered%20peaks%2C%20soft%20warm%20light%2C%20vast%20landscape'), cap: '云海之上的步道' }
    ]
  ];
  var PASS = 'orchid';

  /* chips 筛选 */
  var chips = document.querySelectorAll('.chips .chip');
  var cards = document.querySelectorAll('.album-card');
  chips.forEach((chip) => {
    chip.addEventListener('click', () => {
      chips.forEach((c) => { c.classList.toggle('is-on', c === chip); });
      var f = chip.getAttribute('data-filter');
      cards.forEach((card) => {
        card.classList.toggle('hidden', !!f && card.getAttribute('data-cat') !== f);
      });
    });
  });

  /* 加密弹窗 */
  var modal = document.getElementById('lockModal');
  var box = document.getElementById('lockBox');
  var input = document.getElementById('lockInput');
  var errEl = document.getElementById('lockError');
  var unlocked = false;

  function openModal() {
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    errEl.textContent = '';
    setTimeout(() => { input.focus(); }, 60);
  }
  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    input.value = '';
    errEl.textContent = '';
  }
  function unlockSuccess() {
    unlocked = true;
    closeModal();
    var lockCard = document.querySelector('.album-card.locked');
    if (lockCard) {
      lockCard.classList.remove('locked');
      var badge = lockCard.querySelector('.lock-badge');
      if (badge) badge.remove();
    }
    showToast('解锁成功');
  }
  function tryUnlock() {
    if (input.value === PASS) { unlockSuccess(); return; }
    errEl.textContent = '密码不对，再试试？';
    box.classList.remove('shake');
    void box.offsetWidth;
    box.classList.add('shake');
    input.select();
  }

  document.getElementById('lockOk').addEventListener('click', tryUnlock);
  document.getElementById('lockCancel').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
  input.addEventListener('input', () => { errEl.textContent = ''; });

  /* toast */
  var toast = document.getElementById('unlockToast');
  var toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
  }

  /* 相册卡点击 */
  function activate(card) {
    var idx = parseInt(card.getAttribute('data-album'), 10);
    if (card.classList.contains('locked')) { openModal(); return; }
    if (window.QyLightbox) window.QyLightbox.open(ALBUMS[idx] || [], 0);
  }
  cards.forEach((card) => {
    card.addEventListener('click', () => { activate(card); });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(card); }
    });
  });
})();
</script>
<div id="unlockToast" aria-live="polite" style="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:330;background:hsl(var(--accent-h) 30% 40%);color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;pointer-events:none;">解锁成功</div>
</body>
