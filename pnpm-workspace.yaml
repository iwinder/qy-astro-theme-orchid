packages:
  - packages/*
  - site
# 显式指定 store 绝对路径：pnpm 在 store 未显式配置时会用临时文件探测（create+unlink），
# 该探测在 TRAE sandbox 下被误报 EXDEV 导致安装中断；绝对路径走直通分支跳过探测，
# 路径与 PNPM_HOME 默认推导值一致，数据位置不变。
storeDir: /Volumes/zhitai/Work/repositories/pnpm/store
# 统一 katex 版本：主题包 / rehype-katex 等必须共享同一实例，
# mhchem 宏（import 'katex/contrib/mhchem'）才能对 rehype-katex 生效
overrides:
  katex: ^0.19.0
  # micromark-util-character@2.0.0 的 unicodePunctuation 正则缺 \p{S}，
  # 导致 remark-directive 无法解析带 "=" initializer 的指令属性
  # （如 ::github{repo="user/repo"}，"=" 属 Sm 类不匹配 /\p{P}/u）；
  # 2.1.x 起修复为 /\p{P}|\p{S}/u，锁死升级防回退
  micromark-util-character: ^2.1.1
